<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="DocSeva">
  <title>DocSeva</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fe4"/>
      <stop offset="1" stop-color="#0e2440"/>
    </linearGradient>
  </defs>

  <!-- Full bleed so the mark survives WhatsApp's circular crop. -->
  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- Shield and tick, scaled up from the 24px mark used on the website. -->
  <g transform="translate(320 320) scale(15.4) translate(-12 -12)"
     fill="none" stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 2.75 4.75 5.6v5.53c0 4.42 2.9 8.5 7.25 9.87 4.35-1.37 7.25-5.45 7.25-9.87V5.6L12 2.75Z" stroke-width="1.5"/>
    <path d="m8.9 12.1 2.1 2.1 4.1-4.3" stroke-width="1.8"/>
  </g>
</svg>
